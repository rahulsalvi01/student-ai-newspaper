name: Daily newspaper generation

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to run (all, generate_only, email_only)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - generate_only
          - email_only

permissions:
  contents: read

concurrency:
  group: daily-newspaper-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger protected generation endpoint
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'email_only'
        env:
          GENERATE_URL: ${{ secrets.NEWSPAPER_GENERATE_URL }}
          GENERATE_SECRET: ${{ secrets.NEWSPAPER_GENERATE_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${GENERATE_URL:-}" ] || [ -z "${GENERATE_SECRET:-}" ]; then
            echo "::error::Required repository secrets NEWSPAPER_GENERATE_URL or NEWSPAPER_GENERATE_SECRET are missing."
            echo "Please configure them in repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # Sanitize URL and Secret cleanly via python3
          CLEAN_URL="$(python3 -c "import os; u = os.environ.get('GENERATE_URL', '').strip().strip('\"\''); print(u if u.endswith('/api/generate') else u.rstrip('/') + '/api/generate')")"
          CLEAN_SECRET="$(python3 -c "import os; print(os.environ.get('GENERATE_SECRET', '').strip().strip('\"\''))")"

          echo "Connecting to production generation endpoint..."

          # Call the endpoint without printing secrets. Save response body to /tmp/generate-response.json.
          status_code="$(curl --silent --show-error \
            --output /tmp/generate-response.json \
            --write-out "%{http_code}" \
            --max-time 240 \
            --request POST \
            --header "Authorization: Bearer ${CLEAN_SECRET}" \
            --header "Content-Type: application/json" \
            --data '{"trigger":"scheduled","timezone":"Asia/Kolkata"}' \
            "${CLEAN_URL}")"

          if [ "${status_code}" -lt 200 ] || [ "${status_code}" -ge 300 ]; then
            echo "::error::Generation endpoint failed with HTTP ${status_code}."
            # Safely report error details without exposing credentials
            python3 -c "
          import json
          try:
              with open('/tmp/generate-response.json') as f:
                  data = json.load(f)
              err = data.get('error', 'UNKNOWN_ERROR')
              msg = data.get('message', 'No details provided.')
              print(f'Error code: {err}')
              print(f'Message: {msg}')
          except Exception:
              print('Could not parse JSON response.')
          "
            exit 1
          fi

          echo "Generation endpoint completed successfully with HTTP ${status_code}."
          python3 -c "
          import json
          try:
              with open('/tmp/generate-response.json') as f:
                  data = json.load(f)
              print(f'Issue Date:     {data.get(\"issueDate\")}')
              print(f'Edition Status: {data.get(\"editionStatus\")}')
              print(f'Article Count:  {data.get(\"articleCount\")}')
              print(f'Edition URL:    {data.get(\"editionUrl\")}')
              print(f'Sources Attempted: {data.get(\"sourcesFetched\")}')
              print(f'Sources Succeeded: {data.get(\"sourcesAccepted\")}')
              print(f'Sources Failed:    {data.get(\"sourcesFailed\")}')
          except Exception:
              pass
          "

      - name: Email the ready edition link to Gmail
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'generate_only'
        env:
          GENERATE_URL: ${{ secrets.NEWSPAPER_GENERATE_URL }}
          GENERATE_SECRET: ${{ secrets.NEWSPAPER_GENERATE_SECRET }}
          GMAIL_ADDRESS: ${{ secrets.NEWSPAPER_GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.NEWSPAPER_GMAIL_APP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json
          import os
          import smtplib
          import ssl
          import sys
          import urllib.error
          import urllib.request
          from email.message import EmailMessage
          from urllib.parse import urlparse

          gmail = os.environ.get("GMAIL_ADDRESS", "").strip().strip('"').strip("'")
          app_password = os.environ.get("GMAIL_APP_PASSWORD", "").replace(" ", "").strip().strip('"').strip("'")
          gen_secret = os.environ.get("GENERATE_SECRET", "").strip().strip('"').strip("'")
          gen_url = os.environ.get("GENERATE_URL", "").strip().strip('"').strip("'")

          if not gmail or not app_password:
              sys.exit("::error::Missing Gmail Actions secrets. Configure NEWSPAPER_GMAIL_ADDRESS and NEWSPAPER_GMAIL_APP_PASSWORD.")

          if not gen_url or not gen_secret:
              sys.exit("::error::Missing generation secrets. Configure NEWSPAPER_GENERATE_URL and NEWSPAPER_GENERATE_SECRET.")

          base_url = gen_url.replace("/api/generate", "").rstrip("/")
          if not base_url:
              sys.exit("::error::Invalid GENERATE_URL secret to determine website base URL.")

          # 1. Fetch active recipient list dynamically from protected endpoint
          recipients_url = f"{base_url}/api/subscribers/recipients"
          try:
              req = urllib.request.Request(
                  recipients_url,
                  headers={
                      "Authorization": f"Bearer {gen_secret}",
                      "User-Agent": "GitHub-Actions-Email-Step",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  if resp.status < 200 or resp.status >= 300:
                      sys.exit(f"::error::Endpoint /api/subscribers/recipients failed with HTTP {resp.status}.")
                  raw_body = resp.read().decode("utf-8")
                  data = json.loads(raw_body)
          except urllib.error.HTTPError as exc:
              sys.exit(f"::error::Endpoint /api/subscribers/recipients failed with HTTP {exc.code}.")
          except Exception as exc:
              sys.exit(f"::error::Endpoint /api/subscribers/recipients request failed: {exc}.")

          if not isinstance(data, dict) or "recipients" not in data or not isinstance(data["recipients"], list):
              sys.exit("::error::Endpoint /api/subscribers/recipients returned an invalid payload (expected JSON object with 'recipients' list).")

          raw_list = data["recipients"]
          recipients = []
          for r in raw_list:
              if isinstance(r, str) and r.strip():
                  cleaned = r.strip().lower()
                  if cleaned not in recipients:
                      recipients.append(cleaned)

          # Log only the count to protect subscriber privacy (never print addresses)
          print(f"Retrieved {len(recipients)} active subscriber(s) from /api/subscribers/recipients.")

          # If no active subscribers exist, exit cleanly without sending so cron does not fail
          if not recipients:
              print("Notice: No active subscribers found in database. Exiting cleanly without sending email.")
              sys.exit(0)

          edition_url = None
          issue_date = "Today's edition"
          article_count = None

          # 2. If /tmp/generate-response.json exists (e.g. from manual run or step 1), use it
          if os.path.exists("/tmp/generate-response.json"):
              try:
                  with open("/tmp/generate-response.json", "r", encoding="utf-8") as f:
                      result = json.load(f)
                  edition_url = result.get("editionUrl")
                  issue_date = result.get("issueDate", "Today's edition")
                  article_count = result.get("articleCount")
              except Exception:
                  pass

          # 3. If running standalone at 08:00 AM, fetch latest ready edition from server
          if not edition_url:
              try:
                  ed_req = urllib.request.Request(f"{base_url}/api/editions", headers={"User-Agent": "GitHub-Actions-Email-Step"})
                  with urllib.request.urlopen(ed_req, timeout=30) as resp:
                      ed_data = json.loads(resp.read().decode("utf-8"))
                  editions = ed_data.get("editions", [])
                  if editions:
                      latest = editions[0]
                      issue_date = latest.get("issue_date", "Today's edition")
                      article_count = latest.get("article_count", 0)
                      edition_url = f"{base_url}/history/{issue_date}"
                  else:
                      edition_url = f"{base_url}/"
              except Exception as exc:
                  sys.exit(f"::error::Could not query editions from {base_url}/api/editions: {exc}")

          parsed_url = urlparse(edition_url) if isinstance(edition_url, str) else None
          if not parsed_url or parsed_url.scheme != "https" or not parsed_url.netloc:
              sys.exit("::error::Generation response must include a valid HTTPS editionUrl. No email sent.")

          # 4. Address privacy: To is sender Gmail; Bcc contains all active subscribers
          msg = EmailMessage()
          msg["Subject"] = f"Your AI & Tech Newspaper is ready — {issue_date}"
          msg["From"] = gmail
          msg["To"] = gmail
          msg["Bcc"] = ", ".join(recipients)

          count_line = f"Stories in this edition: {article_count}\n\n" if isinstance(article_count, int) else ""
          msg.set_content(
              "Your daily AI & technology newspaper is ready.\n\n"
              + count_line
              + "Open today's edition here:\n"
              + edition_url
              + "\n\nThis email contains a link to your newspaper, not copied publisher articles.\n"
          )

          try:
              context = ssl.create_default_context()
              with smtplib.SMTP_SSL("smtp.gmail.com", 465, context=context, timeout=30) as server:
                  server.login(gmail, app_password)
                  server.send_message(msg, from_addr=gmail, to_addrs=recipients)
              
              print(f"Edition link emailed successfully via Bcc to {len(recipients)} recipient(s).")
          except Exception as exc:
              # Explicit failure reporting without printing passwords
              sys.exit(f"::error::Failed to send email via Gmail SMTP: {type(exc).__name__}: {exc}")
          PYCODE
